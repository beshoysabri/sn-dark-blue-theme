name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-published
# theme is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify the theme is internally consistent
        run: |
          set -euo pipefail

          EXT=$(python3 -c "import json;print(json.load(open('ext.json'))['version'])")
          PKG=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          if [ "$EXT" != "$PKG" ]; then
            echo "::error::version drift — ext.json=$EXT package.json=$PKG"
            exit 1
          fi

          test -f dist/fonts/InterVariable.woff2        || { echo "::error::missing roman woff2"; exit 1; }
          test -f dist/fonts/InterVariable-Italic.woff2 || { echo "::error::missing italic woff2"; exit 1; }

          python3 - <<'PY'
          import re, sys, hashlib

          css = open('dist/dist.css').read()
          # Strip comments so the opt-in blocks in section 4 never count as live.
          stripped = re.sub(r'/\*.*?\*/', '', css, flags=re.S)

          def fail(msg):
              print(f'::error::{msg}')
              sys.exit(1)

          # Standard Notes inlines theme CSS rather than linking it, so a
          # relative @font-face src resolves against the app's own origin and
          # 404s. v2.2.0 shipped that bug. Both srcs must be absolute.
          BASE = 'https://beshoysabri.github.io/sn-dark-blue-theme/dist/fonts'
          for face in ('InterVariable.woff2', 'InterVariable-Italic.woff2'):
              if f"url('{BASE}/{face}')" not in stripped:
                  fail(f'@font-face src for {face} is not the absolute Pages URL')

          # Every colour must stay byte-identical to v2.1.0. Digesting only the
          # --sn-stylekit-* names covered 51 of 93 custom properties and left 39
          # real colours unguarded — navigation, items column, editor, titlebar,
          # text selection, popover. The 3 --sn-inter-* typography knobs are the
          # only custom properties deliberately excluded.
          decls = [(k, ' '.join(v.split()))
                   for k, v in re.findall(r'(--[\w-]+)\s*:\s*([^;]+);', stripped)
                   if not k.startswith('--sn-inter-')]
          if len(decls) != 90:
              fail(f'expected 90 colour declarations, found {len(decls)}')
          digest = hashlib.sha256('\n'.join(f'{k}={v}' for k, v in decls).encode()).hexdigest()
          EXPECTED = '3fd01e1638f238f3cf37cc490e95b826f567d9c7698a3139da9a3bfc13298008'
          if digest != EXPECTED:
              fail(f'colours changed — digest {digest} != expected {EXPECTED}')

          # A font that is declared but never applied is the v2.2.0 bug wearing
          # a different hat: CI stayed green while nothing actually rendered.
          if 'font-family: var(--sn-inter-font) !important' not in stripped:
              fail('nothing applies --sn-inter-font — the app-wide rule is gone')
          if not re.search(r'html\s*,\s*body\s*,\s*body\s*\*', stripped):
              fail('the app-wide selector (html, body, body *) is missing')

          # Note: the Daily view recolour must reference the accent rather than
          # redeclaring danger. No separate check is needed — a redeclaration
          # would push the count to 91 and break the digest above.

          # The section 5 opt-ins must stay commented out.
          if 'font-family: revert' in stripped:
              fail('the "confine Inter to the editor" opt-in block is uncommented')

          # Count braces on the stripped source; counting the raw file also
          # counts braces inside the commented-out blocks and hides a real
          # imbalance behind them.
          if stripped.count('{') != stripped.count('}'):
              fail('unbalanced braces in dist.css')

          print(f'dist.css ok — {len(decls)} colours unchanged, Inter applied, absolute srcs, braces balanced')
          PY

          echo "ok — publishing v$EXT"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
