name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-published
# theme is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify the theme is internally consistent
        run: |
          set -euo pipefail

          EXT=$(python3 -c "import json;print(json.load(open('ext.json'))['version'])")
          PKG=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          if [ "$EXT" != "$PKG" ]; then
            echo "::error::version drift — ext.json=$EXT package.json=$PKG"
            exit 1
          fi

          test -f dist/fonts/InterVariable.woff2        || { echo "::error::missing roman woff2"; exit 1; }
          test -f dist/fonts/InterVariable-Italic.woff2 || { echo "::error::missing italic woff2"; exit 1; }

          python3 - <<'PY'
          import re, sys, hashlib

          css = open('dist/dist.css').read()
          # Strip comments so the opt-in blocks in section 4 never count as live.
          stripped = re.sub(r'/\*.*?\*/', '', css, flags=re.S)

          def fail(msg):
              print(f'::error::{msg}')
              sys.exit(1)

          # Standard Notes inlines theme CSS rather than linking it, so a
          # relative @font-face src resolves against the app's own origin and
          # 404s. v2.2.0 shipped that bug. Both srcs must be absolute.
          BASE = 'https://beshoysabri.github.io/sn-dark-blue-theme/dist/fonts'
          for face in ('InterVariable.woff2', 'InterVariable-Italic.woff2'):
              if f"url('{BASE}/{face}')" not in stripped:
                  fail(f'@font-face src for {face} is not the absolute Pages URL')

          # The colour block must stay byte-identical to v2.1.0. Spot-checking
          # a single variable let the other 50 drift unnoticed, so digest all.
          decls = re.findall(r'(--sn-stylekit-[\w-]+)\s*:\s*([^;]+);', stripped)
          if len(decls) != 51:
              fail(f'expected 51 --sn-stylekit declarations, found {len(decls)}')
          digest = hashlib.sha256('\n'.join(f'{k}={v}' for k, v in decls).encode()).hexdigest()
          EXPECTED = 'd07a03c02353ff6311f74d0d76e61f0203f686336abbf2e39cb82071beb15ccc'
          if digest != EXPECTED:
              fail(f'colour block changed — digest {digest} != expected {EXPECTED}')

          # The section 4 opt-ins must stay commented out.
          if 'font-family: revert' in stripped:
              fail('the "confine Inter to the editor" opt-in block is uncommented')

          # Count braces on the stripped source; counting the raw file also
          # counts braces inside the commented-out blocks and hides a real
          # imbalance behind them.
          if stripped.count('{') != stripped.count('}'):
              fail('unbalanced braces in dist.css')

          print('dist.css ok — 51 colours unchanged, absolute font srcs, braces balanced')
          PY

          echo "ok — publishing v$EXT"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
